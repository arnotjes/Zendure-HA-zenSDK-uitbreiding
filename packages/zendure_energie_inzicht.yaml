##############################################################################
# Zendure Energie Inzicht
# Versie: 2026-06-06
# Werkt volledig los van Gielz, of samen met Gielz
#
# Wat heb je nodig:
#   - Zendure 2400 AC verbonden met je netwerk
#   - IP-adres van de Zendure invullen via Home Assistant UI
#   - Optioneel: Homewizard P1 meter
#   - Optioneel: aparte PV omvormer sensor
#   - Optioneel: Nordpool integratie
##############################################################################

##############################################################################
# INVOERVELDEN
##############################################################################

input_button:
  accu_statistieken_reset:
    name: Accu Statistieken Reset
    icon: mdi:restart

input_boolean:
  dynamisch_15_minuten:
    name: Dynamisch 15 Minuten
    icon: mdi:clock-time-three-outline

input_text:
  zendure_2400_ac_ip_adres:
    name: Zendure 2400 AC IP-adres
    icon: mdi:ip
    max: 50
    mode: text

  zendure_2400_ac_batterij_volgorde:
    name: Zendure 2400 AC Batterij Volgorde
    icon: mdi:flip-vertical
    max: 44
    mode: text

  homewizard_p1_ip_adres:
    name: Homewizard P1 IP-adres
    icon: mdi:ip
    max: 50
    mode: text

  afwijkende_p1_sensor:
    name: Afwijkende P1 Sensor
    icon: mdi:transmission-tower
    max: 250
    mode: text

  afwijkende_pv_sensor:
    name: Afwijkende PV Sensor
    icon: mdi:solar-power
    max: 250
    mode: text

  dynamisch_nordpool_sensor:
    name: Dynamisch Nordpool Sensor
    icon: mdi:cash
    max: 250
    mode: text

  accu_teruglever_sensor:
    name: Dynamisch Teruglever Sensor
    icon: mdi:cash-minus
    max: 250
    mode: text

input_number:
  zendure_2400_ac_minimaal_toegestaan_laadpercentage:
    name: Zendure 2400 AC Minimaal Toegestaan Laadpercentage
    icon: mdi:percent-box
    min: 5
    max: 50
    step: 1
    unit_of_measurement: "%"
    mode: box

  zendure_2400_ac_maximaal_toegestaan_laadpercentage:
    name: Zendure 2400 AC Maximaal Toegestaan Laadpercentage
    icon: mdi:percent-box
    min: 70
    max: 100
    step: 1
    unit_of_measurement: "%"
    mode: box

  accu_laadkosten_offset:
    name: Accu Laadkosten Offset
    icon: mdi:currency-eur
    min: 0
    max: 100000
    step: 0.000001
    mode: box
    unit_of_measurement: "€"

  accu_opbrengst_offset:
    name: Accu Opbrengst Offset
    icon: mdi:currency-eur
    min: 0
    max: 100000
    step: 0.000001
    mode: box
    unit_of_measurement: "€"

  accu_netto_besparing_offset:
    name: Accu Netto Besparing Offset
    icon: mdi:currency-eur
    min: 0
    max: 100000
    step: 0.000001
    mode: box
    unit_of_measurement: "€"

  accu_kostprijs_totaal:
    name: Accu Kostprijs Totaal
    icon: mdi:currency-eur
    min: 0
    max: 100
    step: 0.000001
    mode: box
    unit_of_measurement: "€"

  accu_aanschafprijs:
    name: Accu Aanschafprijs
    icon: mdi:currency-eur
    min: 0
    max: 10000
    step: 1
    mode: box
    unit_of_measurement: "€"

##############################################################################
# SENSOREN - platform sensoren (history_stats, statistics, integration)
##############################################################################

sensor:
  # --- Statistieken ---
  - platform: statistics
    name: "Zendure 2400 AC Efficiëntie Import (24u gemiddelde)"
    unique_id: zendure_2400_ac_efficientie_import_24u
    entity_id: sensor.zendure_2400_ac_efficientie_import
    state_characteristic: mean
    sampling_size: 86400
    max_age:
      hours: 24

  - platform: statistics
    name: "Zendure 2400 AC Efficiëntie Export (24u gemiddelde)"
    unique_id: zendure_2400_ac_efficientie_export_24u
    entity_id: sensor.zendure_2400_ac_efficientie_export
    state_characteristic: mean
    sampling_size: 86400
    max_age:
      hours: 24

  # --- Energie integratie ---
  - platform: integration
    name: "Zendure 2400 AC PV Import"
    unique_id: zendure_2400_ac_pv_import
    source: sensor.pv_aansturing_vermogen
    unit_prefix: k
    round: 2
    method: trapezoidal

  - platform: integration
    name: "Zendure 2400 AC Energie Import"
    unique_id: zendure_2400_ac_energie_import
    source: sensor.zendure_2400_ac_vermogen_import
    unit_prefix: k
    round: 2
    method: trapezoidal

  - platform: integration
    name: "Zendure 2400 AC Energie Export"
    unique_id: zendure_2400_ac_energie_export
    source: sensor.zendure_2400_ac_vermogen_export
    unit_prefix: k
    round: 2
    method: trapezoidal

  - platform: integration
    name: "Accu Laadkosten Totaal"
    unique_id: accu_laadkosten_totaal
    source: sensor.accu_laadkosten_per_moment
    round: 6
    method: left
    unit_time: h

  - platform: integration
    name: "Accu Opbrengst Totaal"
    unique_id: accu_opbrengst_totaal
    source: sensor.accu_opbrengst_per_moment
    round: 6
    method: left
    unit_time: h

  - platform: integration
    name: "Accu Netto Besparing Totaal"
    unique_id: accu_netto_besparing_totaal
    source: sensor.accu_netto_besparing_per_moment
    round: 6
    method: left
    unit_time: h

  # --- GitHub versiecheck ---
  - platform: rest
    name: "GitHub Zendure-HA-zenSDK-uitbreiding (arnotjes)"
    unique_id: github_zendure_ha_zensdk_uitbreiding_arnotjes
    resource: "https://api.github.com/repos/arnotjes/Zendure-HA-zenSDK-uitbreiding/releases/latest"
    headers:
      User-Agent: "HomeAssistant"
    scan_interval: 3600
    json_attributes:
      - tag_name
      - name
      - published_at
      - body
    value_template: "{{ value_json.name }}"
    icon: mdi:github

##############################################################################
# UTILITY METERS
##############################################################################

utility_meter:
  zendure_2400_ac_pv_import_dagelijks:
    source: sensor.zendure_2400_ac_pv_import
    unique_id: utility_meter.zendure_2400_ac_pv_import_dagelijks
    name: Zendure 2400 AC PV Import Dagelijks
    cycle: daily

  accu_laadkosten_vandaag:
    source: sensor.accu_laadkosten_totaal
    name: Accu Laadkosten Vandaag
    unique_id: accu_laadkosten_vandaag
    cycle: daily

  accu_besparing_vandaag:
    source: sensor.accu_opbrengst_totaal
    name: Accu Besparing Vandaag
    unique_id: accu_besparing_vandaag
    cycle: daily

##############################################################################
# REST - Zendure 2400 AC lokale API uitlezen
##############################################################################

rest:
  # --- Homewizard P1 meter ---
  - resource_template: "http://{{ states('input_text.homewizard_p1_ip_adres') }}/api/v1/data"
    scan_interval: 1
    sensor:
      - name: "Homewizard P1 Vermogen"
        value_template: "{{ value_json.active_power_w | float }}"
        unique_id: Homewizard_P1_Vermogen
        unit_of_measurement: "W"
        device_class: power

  # --- Zendure 2400 AC /properties/report ---
  - resource_template: "http://{{ states('input_text.zendure_2400_ac_ip_adres') }}/properties/report"
    scan_interval: 1
    sensor:
      - name: "Zendure 2400 AC Vermogen Aansturing"
        value_template: >
          {% set pv = value_json['properties']['pvStatus'] | int(0) %}
          {% set solar = value_json['properties']['solarInputPower'] | float(0) %}
          {% set grid_off = value_json.get('properties', {}).get('gridOffPower', 0) | float(0) %}
          {% set pv_active = (pv == 1) or (solar > 0) or (grid_off < 0) %}
          {% set pass = value_json['properties']['pass'] | int %}
          {% set ac_mode = value_json['properties']['acMode'] | int %}
          {% if not pv_active %}
            {% set opladen = value_json['properties']['outputPackPower'] | float(0) %}
            {% set ontladen = - (value_json['properties']['packInputPower'] | float(0)) %}
            {{ opladen if opladen != 0 else ontladen }}
          {% else %}
            {% set opladen = value_json['properties']['gridInputPower'] | float(0) %}
            {% set opladen_vol = value_json['properties']['outputPackPower'] | float(0) %}
            {% set ontladen = - (value_json['properties']['outputHomePower'] | float(0)) %}
            {% if pass == 2 %}
              {% set result = opladen_vol %}
            {% elif opladen != 0 %}
              {% set result = opladen %}
            {% else %}
              {% set result = ontladen %}
            {% endif %}
            {% if ac_mode == 1 and result < 0 %}
              0
            {% else %}
              {{ result }}
            {% endif %}
          {% endif %}
        unique_id: Zendure_2400_AC_Vermogen_Aansturing
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power

      - name: "Zendure 2400 AC Laadpercentage"
        value_template: "{{ value_json['properties']['electricLevel'] }}"
        device_class: battery
        unit_of_measurement: "%"
        state_class: measurement
        unique_id: Zendure_2400_AC_Laadpercentage

      - name: "Zendure 2400 AC Minimale Laadpercentage"
        value_template: "{{ (value_json['properties']['minSoc'] | int / 10) | int }}"
        device_class: battery
        unit_of_measurement: "%"
        state_class: measurement
        unique_id: Zendure_2400_AC_Minimale_Laadpercentage
        icon: mdi:battery-high

      - name: "Zendure 2400 AC Maximale Laadpercentage"
        value_template: "{{ (value_json['properties']['socSet'] | int / 10) | int }}"
        device_class: battery
        unit_of_measurement: "%"
        state_class: measurement
        unique_id: Zendure_2400_AC_Maximale_Laadpercentage
        icon: mdi:battery-high

      - name: "Zendure 2400 AC Totale Capaciteit"
        unique_id: Zendure_2400_AC_Totale_Capaciteit
        unit_of_measurement: "kWh"
        icon: mdi:flip-vertical
        value_template: >
          {% set mapping = {5: 2.88, 70: 1.92, 300: 1.92, 350: 2.88, 500: 2.40} %}
          {% set packs = value_json.packData %}
          {% if packs %}
            {% set ns = namespace(total=0) %}
            {% for pack in packs %}
              {% set type = pack.packType | int %}
              {% if type in mapping %}
                {% set ns.total = ns.total + mapping[type] %}
              {% endif %}
            {% endfor %}
            {{ ns.total | round(2) }}
          {% else %}
            0
          {% endif %}

      - name: "Zendure 2400 AC Vermogen Export"
        value_template: "{{ value_json['properties']['packInputPower'] | int }}"
        unique_id: Zendure_2400_AC_Vermogen_Export
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power

      - name: "Zendure 2400 AC Vermogen Import"
        value_template: "{{ (value_json['properties']['outputPackPower'] | int) }}"
        unique_id: Zendure_2400_AC_Vermogen_Import
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power

      - name: "Zendure 2400 AC Vermogen Import (DC)"
        unique_id: Zendure_2400_AC_Vermogen_Import_(DC)
        value_template: >
          {% set ns = namespace(total=0) %}
          {% for pack in value_json.packData %}
            {% if pack.state == 1 %}
              {% set ns.total = ns.total + (pack.power | int) %}
            {% endif %}
          {% endfor %}
          {{ ns.total }}
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power

      - name: "Zendure 2400 AC Vermogen Export (DC)"
        unique_id: Zendure_2400_AC_Vermogen_Export_(DC)
        value_template: >
          {% set ns = namespace(total=0) %}
          {% for pack in value_json.packData %}
            {% if pack.state == 2 %}
              {% set ns.total = ns.total + (pack.power | int) %}
            {% endif %}
          {% endfor %}
          {{ ns.total }}
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power

      - name: "Zendure 2400 AC Vermogen Naar Huis"
        value_template: >
          {% set pack_out = value_json['properties']['packInputPower'] | float(0) %}
          {{ pack_out | round(1) }}
        unique_id: Zendure_2400_AC_Vermogen_Naar_Huis
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power

      - name: "Zendure 2400 AC Vermogen Van Huis"
        value_template: >
          {% set grid_in = value_json['properties']['gridInputPower'] | float(0) %}
          {% set grid_off = value_json.get('properties', {}).get('gridOffPower', 0) | float(0) %}
          {{ (grid_in - (grid_off if grid_off > 0 else 0)) | round(1) }}
        unique_id: Zendure_2400_AC_Vermogen_Van_Huis
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power

      - name: "Zendure 2400 AC Vermogen PV Totaal"
        value_template: >
          {% set pv = value_json['properties']['pvStatus'] | int(0) %}
          {% set solar = value_json['properties']['solarInputPower'] | float(0) %}
          {% set grid_off = value_json.get('properties', {}).get('gridOffPower', 0) | float(0) %}
          {% set pv_active = (pv == 1) or (solar > 0) or (grid_off < 0) %}
          {{ (solar + (0 - grid_off if grid_off < 0 else 0)) if pv_active else 0 }}
        unique_id: Zendure_2400_AC_Vermogen_PV_Totaal
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power

      - name: "Zendure 2400 AC Vermogen PV Naar Huis"
        value_template: >
          {% set pv = value_json['properties']['pvStatus'] | int(0) %}
          {% set solar = value_json['properties']['solarInputPower'] | float(0) %}
          {% set grid_off = value_json.get('properties', {}).get('gridOffPower', 0) | float(0) %}
          {% set pv_active = (pv == 1) or (solar > 0) or (grid_off < 0) %}
          {% set home = value_json['properties']['outputHomePower'] | float(0) %}
          {% set pack_in = value_json['properties']['packInputPower'] | float(0) %}
          {{ (home - pack_in) | round(1) if pv_active else 0 }}
        unique_id: Zendure_2400_AC_Vermogen_PV_Naar_Huis
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power

      - name: "Zendure 2400 AC Vermogen PV Naar Batterij"
        value_template: >
          {% set pv = value_json['properties']['pvStatus'] | int(0) %}
          {% set solar = value_json['properties']['solarInputPower'] | float(0) %}
          {% set grid_off = value_json.get('properties', {}).get('gridOffPower', 0) | float(0) %}
          {% set pv_active = (pv == 1) or (solar > 0) or (grid_off < 0) %}
          {% set pack = value_json['properties']['outputPackPower'] | float(0) %}
          {% set grid = value_json['properties']['gridInputPower'] | float(0) %}
          {{ (pack - grid) | round(1) if pv_active else 0 }}
        unique_id: Zendure_2400_AC_Vermogen_PV_Naar_Batterij
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power

      - name: "Zendure 2400 AC PV Doorvoer"
        value_template: >
          {% set solar = value_json['properties']['solarInputPower'] | float(0) %}
          {% set grid_off = value_json.get('properties', {}).get('gridOffPower', 0) | float(0) %}
          {% set pv_active = (solar > 0) or (grid_off < 0) %}
          {% set states = {0: "Batterij", 2: "Huis"} %}
          {% set packState = value_json['properties']['pass'] | int %}
          {{ states.get(packState, "Onbekend") if pv_active else "PV Offline" }}
        unique_id: Zendure_2400_AC_PV_Doorvoer
        icon: mdi:arrow-decision

      - name: "Zendure 2400 AC Omvormer Temperatuur"
        value_template: >
          {% set maxTemp = value_json['properties']['hyperTmp'] | int %}
          {{ (maxTemp - 2731) / 10.0 }}
        unique_id: Zendure_2400_AC_Omvormer_Temperatuur
        unit_of_measurement: "°C"
        state_class: measurement
        device_class: temperature
        icon: mdi:thermometer

      - name: "Zendure 2400 AC Modus"
        value_template: >
          {% set power = states('sensor.zendure_2400_ac_vermogen_aansturing') | float(0) %}
          {% if power > 0 %}
            Opladen
          {% elif power < 0 %}
            Ontladen
          {% else %}
            Standby
          {% endif %}
        unique_id: Zendure_2400_AC_Modus
        icon: >
          {% set power = states('sensor.zendure_2400_ac_vermogen_aansturing') | float(0) %}
          {% if power > 0 %}
            mdi:battery-plus-variant
          {% elif power < 0 %}
            mdi:battery-minus-variant
          {% else %}
            mdi:battery-outline
          {% endif %}

      - name: "Zendure 2400 AC Relais Stand"
        unique_id: Zendure_2400_AC_Relais_Stand
        value_template: >
          {% set states = {1: "Oplaadstand", 2: "Ontlaadstand"} %}
          {% set packState = value_json['properties']['acMode'] | int %}
          {{ states.get(packState, "Onbekend") }}
        icon: mdi:swap-vertical-bold

      - name: "Zendure 2400 AC Opslagmodus"
        value_template: >
          {% set states = {1: "Opslaan in RAM", 0: "Opslaan in Flash"} %}
          {% set packState = value_json['properties']['smartMode'] | int %}
          {{ states.get(packState, "Onbekend") }}
        unique_id: Zendure_2400_AC_Opslagmodus
        icon: mdi:floppy

      - name: "Zendure 2400 AC Batterijspanning"
        value_template: "{{ (value_json['properties']['BatVolt'] | float / 100) | round(2) }}"
        unique_id: Zendure_2400_AC_Batterijspanning
        unit_of_measurement: "V"
        state_class: measurement
        device_class: voltage
        icon: mdi:sine-wave

      - name: "Zendure 2400 AC Error"
        value_template: >
          {% set states = {0: "Geen meldingen", 1: "Zie Zendure APP"} %}
          {% set packState = value_json['properties']['is_error'] | int %}
          {{ states.get(packState, "Onbekend") }}
        unique_id: Zendure_2400_AC_Error
        icon: mdi:battery-alert

      - name: "Zendure 2400 AC Kalibreren"
        value_template: >
          {% set states = {0: "Nee", 1: "Ja"} %}
          {% set packState = value_json['properties']['socStatus'] | int %}
          {{ states.get(packState, "Onbekend") }}
        unique_id: Zendure_2400_AC_Kalibreren
        icon: mdi:battery-heart-variant

      - name: "Zendure 2400 AC Ingesteld Ontlaadvermogen"
        value_template: "{{ value_json['properties']['outputLimit'] }}"
        unique_id: Zendure_2400_AC_Ingesteld_Ontlaadvermogen
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power

      - name: "Zendure 2400 AC Ingesteld Oplaadvermogen"
        value_template: "{{ value_json['properties']['inputLimit'] }}"
        unique_id: Zendure_2400_AC_Ingesteld_Oplaadvermogen
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power

      - name: "Zendure 2400 AC Omvormer Max. Oplaadvermogen"
        value_template: "{{ value_json['properties']['chargeMaxLimit'] }}"
        unique_id: zendure_2400_ac_omvormer_max_oplaadvermogen
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power

      - name: "Zendure 2400 AC Omvormer Max. Ontlaadvermogen"
        value_template: "{{ value_json['properties']['inverseMaxPower'] }}"
        unique_id: zendure_2400_ac_omvormer_max_ontlaadvermogen
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power

      - name: "Zendure 2400 AC Signaalsterkte"
        value_template: >
          {% set rssi = value_json['properties']['rssi'] | int(-100) %}
          {% if rssi >= -60 %}
            Uitstekend
          {% elif rssi >= -70 %}
            Goed
          {% elif rssi >= -80 %}
            Zwak
          {% else %}
            Slecht
          {% endif %}
        unique_id: Zendure_2400_AC_Signaalsterkte
        icon: mdi:wifi

      - name: "Zendure 2400 AC Serienummer"
        unique_id: Zendure_2400_AC_Serienummer
        value_template: "{{ value_json.sn }}"
        icon: mdi:identifier

      - name: "Zendure 2400 AC Productserie"
        unique_id: Zendure_2400_AC_Productserie
        value_template: "{{ value_json.product }}"
        icon: mdi:identifier

      - name: "Zendure 2400 AC Aantal Batterijen"
        value_template: "{{ value_json['properties']['packNum'] }}"
        unique_id: Zendure_2400_AC_Aantal_Batterijen
        icon: mdi:flip-vertical

      - name: "Zendure 2400 AC SOC-limiet Status"
        value_template: >
          {% set states = {0: "Normale werking", 1: "Laadlimiet bereikt", 2: "Ontlaadlimiet bereikt"} %}
          {% set packState = value_json['properties']['socLimit'] | int %}
          {{ states.get(packState, "Onbekend") }}
        unique_id: zendure_2400_ac_soc_limiet_status
        icon: >
          {% if this.state == 'Normale werking' %}
            mdi:battery-medium
          {% elif this.state == 'Laadlimiet bereikt' %}
            mdi:battery-high
          {% elif this.state == 'Ontlaadlimiet bereikt' %}
            mdi:battery-low
          {% else %}
            mdi:battery-outline
          {% endif %}

      - name: "Zendure 2400 AC Offgrid Modus"
        value_template: >
          {% set states = {0: "Normaal", 1: "Eco", 2: "Uitgeschakeld"} %}
          {% set packState = value_json.get('properties', {}).get('gridOffMode', 2) | int %}
          {{ states.get(packState, "Onbekend") }}
        unique_id: Zendure_2400_AC_Offgrid_Modus
        icon: >
          {% if this.state == 'Normaal' %}
            mdi:power-plug
          {% elif this.state == 'Eco' %}
            mdi:power-plug
          {% elif this.state == 'Uitgeschakeld' %}
            mdi:power-plug-off
          {% else %}
            mdi:power-plug-outline
          {% endif %}

      - name: "Zendure 2400 AC Vermogen Offgrid Stopcontact 1"
        value_template: "{{ value_json.get('properties', {}).get('gridOffPower', 0) | int }}"
        unique_id: Zendure_2400_AC_Vermogen_Offgrid_Stopcontact_1
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power
        icon: mdi:power-plug

      - name: "Zendure 2400 AC Batterij Serienummers"
        value_template: >
          {% set volgorde_raw = states('input_text.zendure_2400_ac_batterij_volgorde') %}
          {% set packdata = value_json['packData'] %}
          {% set ns = namespace(sn_list=[]) %}
          {% if not packdata %}
            unknown
          {% elif volgorde_raw in ['unknown', 'unavailable', ''] %}
            {% for pack in packdata %}
              {% set ns.sn_list = ns.sn_list + [pack['sn']] %}
            {% endfor %}
          {% else %}
            {% set volgorde = volgorde_raw.split(';') %}
            {% for v in volgorde %}
              {% set idx = (v | int) - 1 %}
              {% if idx >= 0 and idx < packdata | length %}
                {% set ns.sn_list = ns.sn_list + [packdata[idx]['sn']] %}
              {% endif %}
            {% endfor %}
          {% endif %}
          {{ ns.sn_list | join('\n') }}
        unique_id: Zendure_2400_AC_Batterij_Serienummers
        icon: mdi:identifier

      # --- Batterij laadpercentages (1 t/m 6) ---
      - name: "Zendure 2400 AC Batterij 1 Laadpercentage"
        value_template: >
          {% set volgorde_raw = states('input_text.zendure_2400_ac_batterij_volgorde') %}
          {% set packdata = value_json['packData'] %}
          {% if not packdata %}
            unknown
